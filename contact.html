    <main class="container">
        <h1 class="section-title">Get In Touch</h1>
        <div class="contact-card">
            <p style="color: var(--text-muted-1); margin-bottom: 30px;">
                Have a project in mind, want to collaborate, or just want to say hi? Fill out the form below or reach out via my socials!
            </p>
            <form id="contact-form" action="#" method="POST">
                <div class="input-group">
                    <label for="name" style="margin-bottom: 8px; font-weight: 500;">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required>
                </div>
                <div class="input-group">
                    <label for="email" style="margin-bottom: 8px; font-weight: 500;">Your Email</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required>
                </div>
                <div class="input-group">
                    <label for="message" style="margin-bottom: 8px; font-weight: 500;">Your Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </main>
